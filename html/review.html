<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review — Linh Nhi Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .review-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      padding: 0;
      height: 48px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .review-bar__title {
      color: #FF6B8A;
      font-weight: 700;
      font-size: 14px;
      padding: 0 20px;
      white-space: nowrap;
      border-right: 1px solid #333;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .review-tabs {
      display: flex;
      height: 100%;
      overflow-x: auto;
    }
    .review-tab {
      background: none;
      border: none;
      color: #999;
      font-size: 13px;
      font-weight: 500;
      padding: 0 20px;
      height: 100%;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .review-tab:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .review-tab--active {
      color: #FF6B8A;
      border-bottom-color: #FF6B8A;
    }
    .review-viewport {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-left: auto;
      padding: 0 20px;
      height: 100%;
      border-left: 1px solid #333;
    }
    .review-viewport button {
      background: none;
      border: 1px solid #555;
      color: #999;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .review-viewport button:hover { border-color: #FF6B8A; color: #FF6B8A; }
    .review-viewport button.active { border-color: #FF6B8A; color: #FF6B8A; background: rgba(255,107,138,0.1); }

    .review-frame {
      margin-top: 48px;
      display: flex;
      justify-content: center;
      padding: 24px;
      min-height: calc(100vh - 48px);
      background: #e0e0e0;
    }
    .review-frame iframe {
      border: none;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      transition: width 0.3s ease, height 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="review-bar">
    <div class="review-bar__title">&#127827; Portfolio Review</div>
    <div class="review-tabs">
      <button class="review-tab review-tab--active" onclick="loadPage('index.html', this)">Home</button>
      <button class="review-tab" onclick="loadPage('about.html', this)">About</button>
      <button class="review-tab" onclick="loadPage('experience.html', this)">Experience</button>
      <button class="review-tab" onclick="loadPage('contact.html', this)">Contact</button>
      <button class="review-tab" onclick="loadPage('design-system.html', this)">Design System</button>
    </div>
    <div class="review-viewport">
      <button class="active" onclick="setViewport(1440, 900, this)">Desktop</button>
      <button onclick="setViewport(375, 812, this)">Mobile</button>
    </div>
  </div>

  <div class="review-frame">
    <iframe id="reviewFrame" src="index.html" width="1440" height="900"></iframe>
  </div>

  <script>
    function loadPage(url, tab) {
      document.getElementById('reviewFrame').src = url;
      document.querySelectorAll('.review-tab').forEach(t => t.classList.remove('review-tab--active'));
      tab.classList.add('review-tab--active');
    }
    function setViewport(w, h, btn) {
      const frame = document.getElementById('reviewFrame');
      frame.width = w;
      frame.height = h;
      document.querySelectorAll('.review-viewport button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
